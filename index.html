<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Messenger & Durak Online</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

  <!-- Экран Авторизации -->
  <div id="auth-screen" class="screen active">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo">⚡</div>
        <h2>Добро пожаловать</h2>
        <p>Войдите или зарегистрируйтесь для общения</p>
      </div>

      <div class="auth-tabs">
        <button id="btn-show-login" class="tab-btn active" onclick="toggleAuthMode('login')">Вход</button>
        <button id="btn-show-reg" class="tab-btn" onclick="toggleAuthMode('register')">Регистрация</button>
      </div>

      <div class="auth-form">
        <input type="text" id="auth-username" placeholder="Логин (никнейм)" autocomplete="off">
        <input type="password" id="auth-password" placeholder="Пароль">

        <div id="reg-extra-fields" style="display: none;">
          <input type="text" id="reg-display-name" placeholder="Отображаемое имя">
          <input type="text" id="reg-avatar-emoji" placeholder="Эмодзи-аватар (например 🚀)">
          <label class="file-input-label">
            <span>Загрузить фото-аватар</span>
            <input type="file" id="reg-avatar-file" accept="image/*">
          </label>
        </div>

        <button id="auth-submit-btn" class="btn primary" onclick="handleAuth()">Войти</button>
      </div>
    </div>
  </div>

  <!-- Экран Чата -->
  <div id="chat-screen" class="screen">
    <!-- Боковое меню -->
    <div id="drawer" class="drawer">
      <div class="drawer-header">
        <div id="drawer-avatar-box" class="avatar-box"></div>
        <div class="drawer-info">
          <div id="drawer-displayname" class="name">User</div>
          <div id="drawer-username" class="username">@user</div>
        </div>
      </div>
      <div class="drawer-menu">
        <button onclick="openProfileModal()"><span class="icon">👤</span> Профиль</button>
        <button onclick="logout()"><span class="icon">🚪</span> Выход</button>
      </div>
    </div>
    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <!-- Основной UI -->
    <div class="chat-container">
      <!-- Шапка -->
      <header class="app-header">
        <button class="icon-btn" onclick="toggleMenu()">☰</button>
        <button id="back-btn" class="icon-btn" style="display:none;" onclick="openGlobalChat()">←</button>
        
        <div class="header-info">
          <div class="header-avatar" id="chat-header-avatar">🌐</div>
          <div>
            <div id="chat-title" class="title">Общий Чат</div>
            <div id="chat-subtitle" class="subtitle">онлайн</div>
          </div>
        </div>

        <div class="header-actions">
          <button class="icon-btn" id="call-btn" onclick="startOrJoinGroupCall()">📞</button>
          <button class="icon-btn" id="durak-btn" onclick="openDurakInviteModal()" title="Сыграть в Дурака">🃏</button>
          <button class="icon-btn" onclick="toggleSearch()">🔍</button>
        </div>
      </header>

      <!-- Панель Поиска -->
      <div id="search-bar" class="search-bar" style="display: none;">
        <input type="text" id="search-input" placeholder="Поиск сообщений..." oninput="searchMessages()">
      </div>

      <!-- Вкладки (Общий / Диалоги) -->
      <div id="tabs-bar" class="tabs-bar">
        <button id="tab-global" class="tab active" onclick="switchTab('global')">🌐 Общий чат</button>
        <button id="tab-directs" class="tab" onclick="switchTab('directs')">💬 Личные сообщения</button>
      </div>

      <!-- Список Личных Сообщений / Поиск Юзеров -->
      <div id="chats-list" class="chats-list" style="display: none;">
        <div class="user-search-box">
          <input type="text" id="user-search-input" placeholder="Поиск пользователей..." oninput="filterUsersList()">
        </div>
        <div id="users-container" class="users-container"></div>
      </div>

      <!-- Баннер Группового Звонка -->
      <div id="group-call-banner" class="call-banner" style="display: none;">
        <span>🎙️ Идет групповой звонок</span>
        <span id="group-call-count">Участников: 0</span>
        <button onclick="startOrJoinGroupCall()">Присоединиться</button>
      </div>

      <!-- Контейнер Сообщений -->
      <div id="messages-container" class="messages-container"></div>

      <!-- Ответ на сообщение -->
      <div id="reply-preview" class="reply-preview" style="display: none;">
        <div id="reply-preview-text"></div>
        <button onclick="cancelReply()">✕</button>
      </div>

      <!-- Панель Ввода -->
      <div id="input-area" class="input-area">
        <label class="icon-btn file-btn">
          📎
          <input type="file" accept="image/*" onchange="sendImage(event)" hidden>
        </label>
        <input type="text" id="message-input" placeholder="Написать сообщение..." onkeypress="handleKeyPress(event)" oninput="handleTyping()">
        <button id="voice-btn" class="icon-btn" onclick="toggleVoiceRecord()">🎙️</button>
        <button class="btn send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <!-- Модалка Входящего Звонка -->
  <div id="incoming-call-box" class="modal-call" style="display: none;">
    <div class="call-card">
      <div id="caller-name">Входящий звонок...</div>
      <div class="call-actions">
        <button class="btn green" onclick="answerCall()">Ответить</button>
        <button class="btn red" onclick="rejectCall()">Сбросить</button>
      </div>
    </div>
  </div>

  <!-- Модалка Звонка/Видео -->
  <div id="call-modal" class="modal">
    <div class="call-container">
      <div id="video-grid" class="video-grid">
        <video id="local-video" autoplay muted playsinline></video>
      </div>
      <div class="call-controls">
        <button id="mic-btn" onclick="toggleMic()">🎤</button>
        <button id="cam-btn" onclick="toggleCam()">📷</button>
        <button class="red" onclick="hangUpGroupCall()">Завершить</button>
      </div>
    </div>
  </div>

  <!-- Модалка Профиля -->
  <div id="profile-modal" class="modal">
    <div class="modal-card">
      <h3>Настройки профиля</h3>
      <input type="text" id="edit-display-name" placeholder="Новое имя">
      <input type="text" id="edit-avatar-emoji" placeholder="Новый эмодзи-аватар">
      <label class="file-input-label">
        <span>Сменить фото</span>
        <input type="file" id="edit-avatar-file" accept="image/*">
      </label>
      <div class="modal-buttons">
        <button class="btn secondary" onclick="closeProfileModal()">Отмена</button>
        <button class="btn primary" onclick="saveProfileChanges()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА ИГРЫ В ДУРАКА -->
  <div id="durak-modal" class="modal">
    <div class="durak-container">
      <div class="durak-header">
        <h2>🃏 Дурак Онлайн</h2>
        <button class="icon-btn" onclick="closeDurakModal()">✕</button>
      </div>

      <!-- Панель приглашения в игру -->
      <div id="durak-setup" class="durak-setup">
        <h3>Создать игру</h3>
        <p>Выберите размер колоды и пригласите соперника из чата:</p>
        <div class="deck-selector">
          <label><input type="radio" name="deck-size" value="54" checked> Колода 54 карты (с джокерами)</label>
          <label><input type="radio" name="deck-size" value="108" > Колода 108 карт (двойная)</label>
        </div>
        <button class="btn primary" onclick="createDurakGame()">Отправить приглашение в чат</button>
      </div>

      <!-- Игровое Поле -->
      <div id="durak-table" class="durak-table" style="display: none;">
        <div class="durak-status-bar">
          <div id="durak-trump-info">Козырь: -</div>
          <div id="durak-deck-count">Карт в колоде: 0</div>
          <div id="durak-turn-info">Ход: -</div>
        </div>

        <div class="durak-opponent-hand" id="durak-opponent-hand"></div>
        <div class="durak-board" id="durak-board"></div>
        <div class="durak-my-hand" id="durak-my-hand"></div>

        <div class="durak-actions">
          <button id="durak-action-btn" class="btn primary" onclick="handleDurakAction()">Беру / Бито</button>
        </div>
      </div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
