<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Messenger & Durak Online</title>
  
  <!-- Стили -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Экран авторизации -->
  <div id="auth-screen" class="active">
    <div class="auth-box">
      <h2>Вход / Регистрация</h2>
      <div class="tabs">
        <button id="btn-show-login" class="active" onclick="toggleAuthMode('login')">Вход</button>
        <button id="btn-show-reg" onclick="toggleAuthMode('register')">Регистрация</button>
      </div>

      <input type="text" id="auth-username" placeholder="Логин (никнейм)" />
      <input type="password" id="auth-password" placeholder="Пароль" />

      <div id="reg-extra-fields" style="display: none;">
        <input type="text" id="reg-display-name" placeholder="Отображаемое имя" />
        <input type="text" id="reg-avatar-emoji" placeholder="Эмодзи-аватар (например, 🚀)" />
        <label>Или загрузи аватарку:</label>
        <input type="file" id="reg-avatar-file" accept="image/*" />
      </div>

      <button id="auth-submit-btn" class="btn primary" onclick="handleAuth()">Войти</button>
    </div>
  </div>

  <!-- Главный экран чата -->
  <div id="chat-screen" style="display:none;">

    <!-- Боковое меню (Drawer) -->
    <div id="drawer">
      <div class="drawer-header">
        <div id="drawer-avatar-box" class="avatar-box">👤</div>
        <div id="drawer-displayname">User Name</div>
        <div id="drawer-username">@username</div>
      </div>
      <div class="drawer-menu">
        <button onclick="openProfileModal()">✏️ Редактировать профиль</button>
        <button onclick="logout()">🚪 Выйти</button>
      </div>
    </div>
    <div id="overlay" onclick="toggleMenu()"></div>

    <!-- Верхняя шапка -->
    <div id="chat-header">
      <button class="icon-btn" onclick="toggleMenu()">☰</button>
      <button class="icon-btn" id="back-btn" style="display:none;" onclick="switchTab('directs')">⬅️</button>
      
      <div id="chat-header-avatar" class="avatar-box">🌐</div>
      <div class="chat-info">
        <div id="chat-title">Общий Чат 🌐</div>
        <div id="chat-subtitle">онлайн</div>
      </div>

      <button class="icon-btn" onclick="startOrJoinGroupCall()">📞</button>
      <button class="icon-btn" onclick="openDurakInviteModal()">🃏</button>
      <button class="icon-btn" onclick="toggleSearch()">🔍</button>
    </div>

    <!-- Табы чатов -->
    <div id="tabs-bar">
      <button id="tab-global" class="active" onclick="switchTab('global')">🌐 Общий чат</button>
      <button id="tab-directs" onclick="switchTab('directs')">💬 Личные сообщения</button>
    </div>

    <!-- Поиск по сообщениям -->
    <div id="search-bar" style="display:none;">
      <input type="text" id="search-input" placeholder="Поиск сообщений..." oninput="searchMessages()">
    </div>

    <!-- Список ЛС -->
    <div id="chats-list" style="display:none;">
      <input type="text" id="user-search-input" placeholder="Поиск пользователя..." oninput="filterUsersList()">
      <div id="users-container"></div>
    </div>

    <!-- Превью ответа -->
    <div id="reply-preview" style="display:none;">
      <span id="reply-preview-text"></span>
      <button onclick="cancelReply()">❌</button>
    </div>

    <!-- Контейнер сообщений -->
    <div id="messages-container"></div>

    <!-- Строка ввода -->
    <div id="input-area">
      <button id="voice-btn" onclick="toggleVoiceRecord()">🎙️</button>
      <button id="circle-btn" onclick="toggleCircleRecord()">📹</button>

      <input type="text" id="message-input" placeholder="Сообщение..." onkeypress="handleKeyPress(event)" oninput="handleTyping()">

      <label for="img-file-input" class="attach-btn">📎</label>
      <input type="file" id="img-file-input" accept="image/*" style="display:none;" onchange="sendImage(event)">

      <button onclick="sendMessage()" class="send-btn">➤</button>
    </div>
  </div>

  <!-- Модалка профиля -->
  <div id="profile-modal" class="modal">
    <div class="modal-content">
      <h3>Редактирование профиля</h3>
      <input type="text" id="edit-display-name" placeholder="Новое имя" />
      <input type="text" id="edit-avatar-emoji" placeholder="Новый эмодзи-аватар" />
      <label>Изменить фото:</label>
      <input type="file" id="edit-avatar-file" accept="image/*" />
      <button onclick="saveProfileChanges()" class="btn primary">Сохранить</button>
      <button onclick="closeProfileModal()" class="btn">Отмена</button>
    </div>
  </div>

  <!-- Модалка Дурака -->
  <div id="durak-modal" class="modal">
    <div class="modal-content" style="max-width: 500px; width: 95%;">
      <h3>🃏 Игра в Дурака</h3>
      <div id="durak-setup">
        <p>Выберите размер колоды:</p>
        <label><input type="radio" name="deck-size" value="54" checked> 54 карты</label><br>
        <label><input type="radio" name="deck-size" value="108"> 108 карт</label><br><br>
        <button onclick="createDurakGame()" class="btn primary">Создать игру</button>
      </div>

      <div id="durak-table" style="display:none;">
        <div id="durak-trump-info"></div>
        <div id="durak-deck-count"></div>
        <div id="durak-turn-info"></div>
        <div id="durak-opponent-hand"></div>
        <div id="durak-board"></div>
        <div id="durak-my-hand"></div>
        <div class="durak-actions">
          <button id="durak-action-btn" class="btn primary" onclick="handleDurakAction()">Беру / Бито</button>
        </div>
      </div>
      <br>
      <button onclick="closeDurakModal()" class="btn">Выйти</button>
    </div>
  </div>

  <!-- Модалка звонка -->
  <div id="call-modal" class="modal">
    <div class="modal-content">
      <h3>Групповой / Личный звонок</h3>
      <video id="local-video" autoplay muted style="width:100%; max-height:200px; border-radius:8px; background:#000;"></video>
      <div id="remote-videos"></div>
      <div style="margin-top:10px;">
        <button onclick="toggleMic()" id="mic-btn">🎤</button>
        <button onclick="toggleCam()" id="cam-btn">📷</button>
        <button onclick="hangUpGroupCall()" class="btn red">Завершить</button>
      </div>
    </div>
  </div>

  <!-- Уведомление о входящем звонке -->
  <div id="incoming-call-box" style="display:none;">
    <span id="caller-name">Звонок...</span>
    <button onclick="answerCall()" class="btn green">Принять</button>
    <button onclick="rejectCall()" class="btn red">Сбросить</button>
  </div>

  <!-- Firebase SDK (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  
  <!-- Конфиг Firebase -->
  <script src="firebase-config.js"></script>

  <!-- Основная логика -->
  <script src="app.js"></script>

  <!-- Регистрация Service Worker для sw.js -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('Service Worker зарегистрирован:', reg.scope))
        .catch(err => console.error('Ошибка регистрации SW:', err));
    }
  </script>
</body>
</html>
