<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messenger</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>

  <!-- Экран авторизации -->
  <div id="auth-screen" class="screen active">
    <div class="auth-box">
      <h2>Вход в Messenger</h2>
      <input type="text" id="username-input" placeholder="Введи имя или ник..." onkeypress="if(event.key==='Enter') login()">
      <button onclick="login()">Войти</button>
    </div>
  </div>

  <!-- Главный экран чата -->
  <div id="chat-screen" class="screen">
    
    <!-- Шапка -->
    <header class="header">
      <button class="icon-btn" onclick="toggleMenu()">☰</button>
      <button id="back-btn" class="icon-btn" style="display: none;" onclick="switchTab('directs')">⬅</button>
      <div class="chat-info-header">
        <div id="chat-title" class="title">Общий Чат 🌐</div>
        <div id="chat-subtitle" class="subtitle">все пользователи</div>
      </div>
      <button id="call-btn" class="icon-btn" onclick="startCall()">📞</button>
    </header>

    <!-- Табы (Общий / Личные) -->
    <div id="tabs-bar" class="tabs-bar">
      <div id="tab-global" class="tab active" onclick="switchTab('global')">Общий</div>
      <div id="tab-directs" class="tab" onclick="switchTab('directs')">Личные & Группы</div>
    </div>

    <!-- Список личных чатов и групп -->
    <div id="chats-list" class="chats-list" style="display: none;"></div>

    <!-- Сообщения -->
    <div id="messages-container" class="messages-container"></div>

    <!-- Поле ввода -->
    <div id="input-area" class="input-area">
      <input type="text" id="message-input" placeholder="Написать сообщение..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">Отправить</button>
    </div>

    <!-- Боковая панель (Drawer) -->
    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>
    <div id="drawer" class="drawer">
      <div class="drawer-header">
        <div class="avatar" id="user-avatar-letter">U</div>
        <div id="drawer-username" class="drawer-username">User</div>
      </div>
      <div class="drawer-menu">
        <div class="drawer-item" onclick="logout()">🚪 Выйти из аккаунта</div>
      </div>
    </div>

  </div>

  <!-- Модалка звонка -->
  <div id="call-modal" class="modal">
    <div class="video-container" id="video-grid">
      <video id="local-video" autoplay muted playsinline></video>
    </div>
    
    <div class="call-controls">
      <button id="mic-btn" class="control-btn" onclick="toggleMic()">🎤</button>
      <button id="cam-btn" class="control-btn" onclick="toggleCam()">📷</button>
      <button class="control-btn hangup" onclick="hangUp()">📞</button>
    </div>
  </div>

  <!-- Плашка входящего звонка -->
  <div id="incoming-call-box" class="incoming-call-box" style="display: none;">
    <div id="caller-name">Входящий звонок...</div>
    <div class="incoming-buttons">
      <button onclick="answerCall()" style="background: #4caf50; color: white;">Принять</button>
      <button onclick="rejectCall()" style="background: #f44336; color: white;">Отклонить</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
