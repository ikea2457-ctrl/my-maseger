<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TG Messenger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Экран Входа -->
  <div id="auth-screen" class="screen active">
    <div class="auth-box">
      <h2>TG Messenger</h2>
      <input type="text" id="username-input" class="auth-input" placeholder="Введи никнейм..." maxlength="20">
      <button class="btn" onclick="login()">Войти в чат</button>
    </div>
  </div>

  <!-- Главный Экран -->
  <div id="chat-screen" class="screen">
    
    <!-- Шапка -->
    <div class="chat-header">
      <div class="header-left">
        <button class="icon-btn" onclick="toggleMenu()">☰</button>
        <button class="icon-btn back-btn" id="back-btn" onclick="openGlobalChat()" style="display:none;">⬅</button>
        <div>
          <div class="chat-title" id="chat-title">Общий Чат 🌐</div>
          <div class="chat-subtitle" id="chat-subtitle">онлайн</div>
        </div>
      </div>
      <div style="display:flex; gap:5px;">
        <button class="icon-btn" id="call-btn" onclick="startCall()" style="color:#4caf50;">📞</button>
        <button class="icon-btn" style="color:#e53935;" onclick="logout()">🚪</button>
      </div>
    </div>

    <!-- Вкладки -->
    <div class="tabs-bar" id="tabs-bar">
      <button class="tab-btn active" id="tab-global" onclick="switchTab('global')">Общий Чат</button>
      <button class="tab-btn" id="tab-directs" onclick="switchTab('directs')">Личные & Группы</button>
    </div>

    <!-- Список пользователей и групп -->
    <div class="chats-list" id="chats-list" style="display: none;"></div>

    <!-- Сообщения -->
    <div class="chat-messages" id="messages-container"></div>

    <!-- Поле ввода -->
    <div class="chat-input-area" id="input-area">
      <label for="image-input" class="icon-btn" style="cursor:pointer; display:flex; align-items:center;">📎</label>
      <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="sendImage(event)">
      
      <input type="text" id="message-input" class="chat-input" placeholder="Сообщение..." onkeypress="handleKeyPress(event)" oninput="handleTyping()">
      
      <button class="icon-btn" id="voice-btn" onclick="toggleVoiceRecord()" style="color:#5288c1;">🎙️</button>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <!-- Модалка видеозвонка -->
  <div class="call-modal" id="call-modal">
    <div class="video-grid" id="video-grid">
      <video id="local-video" autoplay playsinline muted></video>
    </div>
    <div class="call-controls">
      <button class="ctrl-btn" id="mic-btn" onclick="toggleMic()">🎤</button>
      <button class="ctrl-btn" id="cam-btn" onclick="toggleCam()">📷</button>
      <button class="call-end-btn" onclick="hangUp()">❌</button>
    </div>
  </div>

  <!-- Уведомление об инкаминге -->
  <div class="incoming-call-box" id="incoming-call-box">
    <div id="caller-name">Входящий звонок...</div>
    <div style="display:flex; gap:10px; margin-top:10px; justify-content:center;">
      <button class="btn" style="background:#4caf50;" onclick="answerCall()">Ответить</button>
      <button class="btn" style="background:#e53935;" onclick="rejectCall()">Сбросить</button>
    </div>
  </div>

  <!-- Боковое меню -->
  <div class="drawer-overlay" id="overlay" onclick="toggleMenu()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="user-avatar" id="user-avatar-letter">?</div>
      <div style="font-weight: bold;" id="drawer-username">Пользователь</div>
    </div>
    <div class="drawer-menu">
      <div class="menu-item" onclick="openGlobalChat(); toggleMenu();">🌐 Общий чат</div>
      <div class="menu-item" onclick="switchTab('directs'); toggleMenu();">💬 Личные & Группы</div>
      <div class="menu-item" onclick="logout()" style="color:#e53935;">🚪 Выйти</div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Скрипты -->
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
