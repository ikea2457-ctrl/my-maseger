<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Messenger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Экран авторизации -->
    <div id="auth-screen" class="screen">
        <div class="auth-box">
            <h2>Вход в чат</h2>
            <input type="text" id="nickname-input" placeholder="Введите ваш никнейм..." autocomplete="off">
            <button id="login-btn">Войти</button>
        </div>
    </div>

    <!-- Экран чата -->
    <div id="chat-screen" class="screen hidden">
        <div class="chat-header">
            <span id="chat-title">Общий Чат 🌐</span>
            <button id="logout-btn">Выйти</button>
        </div>
        <div id="messages-container" class="messages-container"></div>
        <div class="chat-input-area">
            <input type="text" id="message-input" placeholder="Сообщение..." autocomplete="off">
            <button id="send-btn">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Firebase SDK (compat-версии) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <!-- Скрипты проекта -->
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
