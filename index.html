<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TG Messenger Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Экран Авторизации и Регистрации -->
  <div id="auth-screen" class="screen active">
    <div class="auth-box">
      <h2>TG Messenger</h2>
      <div style="display:flex; gap:10px; margin-bottom:15px;">
        <button class="btn" id="btn-show-login" onclick="toggleAuthMode('login')" style="flex:1;">Вход</button>
        <button class="btn" id="btn-show-reg" onclick="toggleAuthMode('register')" style="flex:1; background:#334455;">Регистрация</button>
      </div>

      <input type="text" id="auth-username" class="auth-input" placeholder="Никнейм (@username)..." maxlength="20">
      <input type="password" id="auth-password" class="auth-input" placeholder="Пароль...">

      <div id="reg-extra-fields" style="display:none;">
        <input type="text" id="reg-display-name" class="auth-input" placeholder="Отображаемое имя..." maxlength="25">
        <label style="color:#aaa; font-size:12px; display:block; margin:5px 0;">Аватарка (Фото или Эмодзи):</label>
        <input type="file" id="reg-avatar-file" accept="image/*" class="auth-input">
        <input type="text" id="reg-avatar-emoji" class="auth-input" placeholder="Или эмодзи (например: ⚡)" maxlength="2">
      </div>

      <button class="btn" id="auth-submit-btn" onclick="handleAuth()">Войти</button>
    </div>
  </div>

  <!-- Главный Экран -->
  <div id="chat-screen" class="screen">
    
    <!-- Шапка -->
    <div class="chat-header">
      <div class="header-left">
        <button class="icon-btn" onclick="toggleMenu()">☰</button>
        <button class="icon-btn back-btn" id="back-btn" onclick="openGlobalChat()" style="display:none;">⬅</button>
        <div class="chat-header-user">
          <div class="chat-header-avatar" id="chat-header-avatar">🌐</div>
          <div>
            <div class="chat-title" id="chat-title">Общий Чат 🌐</div>
            <div class="chat-subtitle" id="chat-subtitle">онлайн</div>
          </div>
        </div>
      </div>
      <div style="display:flex; gap:5px; align-items:center;">
        <button class="icon-btn" onclick="toggleSearch()" title="Поиск">🔍</button>
        <button class="icon-btn" id="call-btn" onclick="startCall()" style="color:#4caf50;">📞</button>
        <button class="icon-btn" style="color:#e53935;" onclick="logout()">🚪</button>
      </div>
    </div>

    <!-- Поисковая строка -->
    <div id="search-bar" style="display:none; padding:8px; background:#17212b;">
      <input type="text" id="search-input" class="chat-input" placeholder="Поиск по сообщениям..." oninput="searchMessages()">
    </div>

    <!-- Вкладки -->
    <div class="tabs-bar" id="tabs-bar">
      <button class="tab-btn active" id="tab-global" onclick="switchTab('global')">Общий Чат</button>
      <button class="tab-btn" id="tab-directs" onclick="switchTab('directs')">Личные & Группы</button>
    </div>

    <!-- Список пользователей и диалогов -->
    <div class="chats-list" id="chats-list" style="display: none;">
      <div style="padding: 10px; background: #17212b;">
        <input type="text" id="user-search-input" class="chat-input" placeholder="Найти пользователя по нику..." oninput="filterUsersList()">
      </div>
      <div id="users-container"></div>
    </div>

    <!-- Сообщения -->
    <div class="chat-messages" id="messages-container"></div>

    <!-- Панель ответа на сообщение -->
    <div id="reply-preview" style="display:none; background:#1e2c3a; padding:5px 10px; color:#fff; font-size:12px; justify-content:space-between; align-items:center;">
      <span id="reply-preview-text"></span>
      <button onclick="cancelReply()" style="background:none; border:none; color:#e53935; cursor:pointer;">❌</button>
    </div>

    <!-- Поле ввода -->
    <div class="chat-input-area" id="input-area">
      <label for="image-input" class="icon-btn" style="cursor:pointer; display:flex; align-items:center;">📎</label>
      <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="sendImage(event)">
      
      <input type="text" id="message-input" class="chat-input" placeholder="Сообщение..." onkeypress="handleKeyPress(event)" oninput="handleTyping()">
      
      <button class="icon-btn" id="voice-btn" onclick="toggleVoiceRecord()" style="color:#5288c1;">🎙️</button>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <!-- Модалка редактирования профиля -->
  <div id="profile-modal" class="call-modal" style="background: rgba(0,0,0,0.85); flex-direction:column; justify-content:center; align-items:center;">
    <div class="auth-box" style="width: 90%; max-width: 350px;">
      <h3>Настройки Профиля</h3>
      <label style="color:#aaa; font-size:12px; display:block; margin-top:10px;">Кастомный ник:</label>
      <input type="text" id="edit-display-name" class="auth-input" maxlength="25">
      
      <label style="color:#aaa; font-size:12px; display:block; margin-top:10px;">Новая аватарка (Фото):</label>
      <input type="file" id="edit-avatar-file" accept="image/*" class="auth-input">
      
      <label style="color:#aaa; font-size:12px; display:block; margin-top:5px;">Или Эмодзи-аватар:</label>
      <input type="text" id="edit-avatar-emoji" class="auth-input" placeholder="Например: 🔥" maxlength="2">

      <div style="display:flex; gap:10px; margin-top:15px;">
        <button class="btn" style="background:#4caf50;" onclick="saveProfileChanges()">Сохранить</button>
        <button class="btn" style="background:#e53935;" onclick="closeProfileModal()">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Модалка видеозвонка -->
  <div class="call-modal" id="call-modal">
    <div class="video-grid" id="video-grid">
      <video id="local-video" autoplay playsinline muted></video>
    </div>
    <div class="call-controls">
      <button class="ctrl-btn" id="mic-btn" onclick="toggleMic()">🎤</button>
      <button class="ctrl-btn" id="cam-btn" onclick="toggleCam()">📷</button>
      <button class="call-end-btn" onclick="hangUp()">❌</button>
    </div>
  </div>

  <!-- Уведомление об инкаминге -->
  <div class="incoming-call-box" id="incoming-call-box">
    <div id="caller-name">Входящий звонок...</div>
    <div style="display:flex; gap:10px; margin-top:10px; justify-content:center;">
      <button class="btn" style="background:#4caf50;" onclick="answerCall()">Ответить</button>
      <button class="btn" style="background:#e53935;" onclick="rejectCall()">Сбросить</button>
    </div>
  </div>

  <!-- Боковое меню -->
  <div class="drawer-overlay" id="overlay" onclick="toggleMenu()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="user-avatar-box" id="drawer-avatar-box">?</div>
      <div>
        <div style="font-weight: bold;" id="drawer-displayname">Никнейм</div>
        <div style="font-size:12px; color:#aaa;" id="drawer-username">@username</div>
      </div>
    </div>
    <div class="drawer-menu">
      <div class="menu-item" onclick="openGlobalChat(); toggleMenu();">🌐 Общий чат</div>
      <div class="menu-item" onclick="switchTab('directs'); toggleMenu();">💬 Личные & Группы</div>
      <div class="menu-item" onclick="openProfileModal(); toggleMenu();">⚙️ Редактировать профиль</div>
      <div class="menu-item" onclick="logout()" style="color:#e53935;">🚪 Выйти</div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Скрипты -->
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
