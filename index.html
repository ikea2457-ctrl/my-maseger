<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мессенджер</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- 1. Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- 2. Твой файл конфигурации Firebase (инициализирует window.db) -->
  <script src="firebase-config.js"></script>
</head>
<body>

  <!-- Экран Авторизации -->
  <div id="auth-screen" class="screen active">
    <div class="auth-card">
      <div class="auth-tabs">
        <button id="btn-show-login" class="auth-tab active">Вход</button>
        <button id="btn-show-reg" class="auth-tab">Регистрация</button>
      </div>
      <input type="text" id="auth-username" class="auth-input" placeholder="Логин">
      <input type="password" id="auth-password" class="auth-input" placeholder="Пароль">
      
      <div id="reg-extra-fields" style="display: none;">
        <input type="text" id="reg-display-name" class="auth-input" placeholder="Имя профиля (Ник)">
        <input type="text" id="reg-avatar-emoji" class="auth-input" placeholder="Эмодзи-аватар (напр. 🚀)">
        <label style="display:block; text-align:left; font-size:12px; margin-bottom:4px; color:#aaa;">Или фото аватара:</label>
        <input type="file" id="reg-avatar-file" class="auth-input" accept="image/*">
      </div>

      <button id="auth-submit-btn" class="auth-btn">Войти</button>
    </div>
  </div>

  <!-- Главный экран Чата -->
  <div id="chat-screen" class="screen">
    <header>
      <button class="header-btn" onclick="window.toggleMenu()">☰</button>
      <button id="back-btn" class="header-btn" style="display:none;" onclick="window.switchTab('directs')">←</button>
      <div class="header-avatar" id="chat-header-avatar">🌐</div>
      <div class="header-title" id="chat-title">Общий Чат 🌐</div>
      <button class="header-btn" onclick="window.toggleSearch()">🔍</button>
      <button class="header-btn" onclick="window.startOrJoinGroupCall()">📞</button>
    </header>

    <div class="tabs-bar">
      <button id="tab-global" class="tab-btn active" onclick="window.switchTab('global')">Общий Чат</button>
      <button id="tab-directs" class="tab-btn" onclick="window.switchTab('directs')">Личные</button>
    </div>

    <!-- Поиск по сообщениям -->
    <div id="search-bar">
      <input type="text" id="search-input" class="auth-input" placeholder="Поиск сообщения..." oninput="window.searchMessages()" style="margin:0;">
    </div>

    <!-- Список диалогов (ЛС) -->
    <div id="chats-list">
      <div class="search-box">
        <input type="text" id="user-search-input" class="auth-input" placeholder="Поиск юзера по логину..." oninput="window.filterUsersList()" style="margin:0;">
      </div>
      <div id="users-container"></div>
    </div>

    <!-- Контейнер Сообщений -->
    <div id="messages-container"></div>

    <!-- Предпросмотр ответа -->
    <div id="reply-preview">
      <span id="reply-preview-text"></span>
      <button onclick="window.cancelReply()" style="background:none; border:none; color:#fff; cursor:pointer;">✕</button>
    </div>

    <!-- Поле Ввода -->
    <div id="input-area">
      <label class="input-btn" style="cursor:pointer;">
        📷
        <input type="file" accept="image/*" style="display:none;" onchange="window.sendImage(event)">
      </label>
      <button class="input-btn" id="voice-btn" onclick="window.toggleVoiceRecord()">🎙️</button>
      <button class="input-btn" id="circle-btn" onclick="window.toggleCircleRecord()">📹</button>
      <input type="text" id="message-input" placeholder="Написать сообщение..." onkeypress="window.handleKeyPress(event)" oninput="window.handleTyping()">
      <button class="input-btn" onclick="window.sendMessage()" style="color:#0088cc;">➔</button>
    </div>
  </div>

  <!-- Боковое меню -->
  <div id="overlay" onclick="window.toggleMenu()"></div>
  <div id="drawer">
    <div class="drawer-header">
      <div class="avatar-box" id="drawer-avatar-box">👤</div>
      <div>
        <div id="drawer-displayname" style="font-weight:bold;">Имя</div>
        <div id="drawer-username" style="font-size:12px; color:#aaa;">@username</div>
      </div>
    </div>
    <div class="drawer-menu">
      <div class="drawer-item" onclick="window.openProfileModal()">✏️ Настройки профиля</div>
      <div class="drawer-item" onclick="window.openDurakInviteModal()">🃏 Сыграть в Дурака</div>
      <div class="drawer-item" onclick="window.logout()" style="color:#ff4d4d;">🚪 Выйти</div>
    </div>
  </div>

  <!-- Модалка Профиля -->
  <div id="profile-modal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom:15px;">Редактировать профиль</h3>
      <input type="text" id="edit-display-name" class="auth-input" placeholder="Новое имя (Ник)">
      <input type="text" id="edit-avatar-emoji" class="auth-input" placeholder="Новый эмодзи-аватар">
      <label style="display:block; font-size:12px; margin-bottom:4px; color:#aaa;">Или загрузить новое фото:</label>
      <input type="file" id="edit-avatar-file" class="auth-input" accept="image/*">
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button class="auth-btn" onclick="window.saveProfileChanges()">Сохранить</button>
        <button class="auth-btn" onclick="window.closeProfileModal()" style="background:#444;">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Модалка Дурака -->
  <div id="durak-modal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom:10px;">Дурак Онлайн</h3>
      <div id="durak-setup">
        <label><input type="radio" name="deck-size" value="54" checked> 54 карты</label><br>
        <label><input type="radio" name="deck-size" value="108"> 108 карт</label><br><br>
        <button class="auth-btn" onclick="window.createDurakGame()">Создать игру</button>
      </div>
      <div id="durak-table" style="display:none; text-align:center;">
        <div id="durak-trump-info" style="margin-bottom:5px;"></div>
        <div id="durak-deck-count" style="margin-bottom:5px;"></div>
        <div id="durak-turn-info" style="font-weight:bold; color:#0088cc; margin-bottom:100px;"></div>
        <div id="durak-board" style="min-height:75px; border:1px dashed #555; margin-bottom:10px; padding:5px;"></div>
        <div id="durak-my-hand"></div>
        <button class="auth-btn" onclick="window.handleDurakAction()" style="margin-top:10px;">Бито / Беру</button>
      </div>
      <button class="auth-btn" onclick="window.closeDurakModal()" style="background:#444; margin-top:10px;">Закрыть</button>
    </div>
  </div>

  <!-- Модалка Звонка -->
  <div id="call-modal" class="modal">
    <div class="modal-content" style="text-align:center;">
      <h3>Групповой звонок</h3>
      <video id="local-video" autoplay muted playsinline style="width:100%; height:200px; background:#000; border-radius:8px; margin:10px 0; object-fit:cover;"></video>
      <div style="display:flex; justify-content:center; gap:10px;">
        <button class="input-btn" onclick="window.toggleMic()">🎙️</button>
        <button class="input-btn" onclick="window.toggleCam()">📹</button>
        <button class="auth-btn" onclick="window.hangUpGroupCall()" style="background:#ff4d4d; width:auto; padding:8px 16px;">Завершить</button>
      </div>
    </div>
  </div>

  <div id="incoming-call-box" style="display:none; position:fixed; bottom:20px; right:20px; background:#242424; padding:15px; border-radius:8px; border:1px solid #0088cc; z-index:300;">
    <div>Входящий звонок...</div>
    <button onclick="window.answerCall()" style="background:green; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Ответить</button>
    <button onclick="window.rejectCall()" style="background:red; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Отклонить</button>
  </div>

  <!-- 3. Основной JS файл приложения -->
  <script src="app.js"></script>
  <!-- 4. Service Worker (если используешь) -->
  <script src="sw.js"></script>
</body>
</html>
